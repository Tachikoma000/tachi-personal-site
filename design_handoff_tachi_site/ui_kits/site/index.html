<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tachi — handles, not halos</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{min-height:100vh}</style>
</head>
<body data-hour="midday">
<div id="root"></div>
<script type="text/babel">
const { Sky, Washi, HourDial, ArrivalScreen, WritingsScreen, PoemsScreen, BookScreen, AboutScreen } = window.TachiDesignSystem_f7b325;
function hourOf(now) {
  const h = now.getHours();
  if (h >= 5 && h < 8) return "dawn";
  if (h >= 8 && h < 12) return "morning";
  if (h >= 12 && h < 16) return "midday";
  if (h >= 16 && h < 19) return "dusk";
  if (h >= 19 && h < 21) return "bleue";
  return "night";
}
function App() {
  const [hour, setHour] = React.useState(hourOf(new Date()));
  const [view, setView] = React.useState("arrival");
  React.useEffect(() => { document.body.dataset.hour = hour; }, [hour]);
  const go = (id) => { setView(id); window.scrollTo(0, 0); };
  const screens = {
    arrival: <ArrivalScreen key="arrival" onNavigate={go} />,
    writings: <WritingsScreen key="writings" onNavigate={go} />,
    poems: <PoemsScreen key="poems" onNavigate={go} />,
    book: <BookScreen key="book" onNavigate={go} />,
    about: <AboutScreen key="about" onNavigate={go} />,
  };
  return (
    <React.Fragment>
      <Sky />
      <Washi />
      <main className="page">{screens[view]}</main>
      <HourDial hour={hour} onChange={setHour} />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
